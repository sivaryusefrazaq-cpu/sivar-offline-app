<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Measurement Details</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
    -webkit-text-size-adjust:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:
        radial-gradient(circle at top left,#4f46e5,#111827 55%),
        linear-gradient(135deg,#0f172a,#1e293b);
    overflow-x:hidden;
    overflow-y:auto;
    padding:20px;
}

.details-box{
    width:560px;
    max-width:100%;
    max-height:calc(100dvh - 40px);
    overflow-y:auto;
    padding:35px 30px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 10px 40px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.15);
    color:#fff;
}

.title{
    font-size:clamp(24px, 7vw, 32px);
    line-height:1.15;
    text-align:center;
    margin-bottom:10px;
    overflow-wrap:anywhere;
}

.phone{
    text-align:center;
    color:rgba(255,255,255,0.7);
    margin-bottom:25px;
    font-size:16px;
    overflow-wrap:anywhere;
}

.measurement-table{
    width:100%;
    margin-bottom:20px;
    overflow-x:auto;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.16);
    background:linear-gradient(180deg,rgba(255,255,255,0.10),rgba(255,255,255,0.045));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 30px rgba(0,0,0,0.20);
}

.measurement-grid{
    width:100%;
    min-width:390px;
    border-collapse:collapse;
    background:transparent;
}

.measurement-grid th,
.measurement-grid td{
    border-bottom:1px solid rgba(255,255,255,0.13);
    border-right:1px solid rgba(255,255,255,0.10);
    padding:13px 12px;
    color:#fff;
    min-height:42px;
}

.measurement-grid th:last-child,
.measurement-grid td:last-child{
    border-right:none;
}

.measurement-grid tr:last-child td{
    border-bottom:none;
}

.measurement-grid th{
    background:linear-gradient(135deg,rgba(99,102,241,0.92),rgba(6,182,212,0.82));
    font-size:15px;
    font-weight:800;
    text-transform:lowercase;
    letter-spacing:.02em;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
}

.measurement-grid td{
    outline:none;
    font-size:16px;
    vertical-align:top;
    word-break:break-word;
    background:rgba(255,255,255,0.035);
    transition:background .2s ease, box-shadow .2s ease;
}

.measurement-grid tr:nth-child(even) td{
    background:rgba(255,255,255,0.065);
}

.measurement-grid tr:hover td{
    background:rgba(6,182,212,0.11);
}

.measurement-grid td[contenteditable="true"]:focus{
    background:rgba(6,182,212,0.18);
    box-shadow:inset 0 0 0 2px rgba(6,182,212,0.42);
}

.measurement-grid td[contenteditable="false"]{
    opacity:.8;
    cursor:not-allowed;
}

.number-cell{
    width:38px;
    text-align:center;
    font-weight:800;
    color:rgba(255,255,255,0.72);
    background:rgba(15,23,42,0.22) !important;
}

.size-cell{
    width:95px;
    text-align:center;
    font-weight:700;
}

.place-cell{
    width:auto;
}

.measurement-total-row{
    display:flex;
    align-items:center;
    gap:12px;
    justify-content:flex-end;
    margin:10px 0 24px;
}

.measurement-total-box{
    min-width:120px;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,0.20);
    border-radius:16px;
    background:linear-gradient(135deg,rgba(99,102,241,0.24),rgba(6,182,212,0.18));
    color:#fff;
    text-align:center;
    font-weight:800;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 24px rgba(0,0,0,0.18);
}

.measurement-total-label{
    color:rgba(255,255,255,0.88);
    font-family:'Noto Naskh Arabic','Segoe UI',Arial,sans-serif;
    font-weight:800;
    font-size:18px;
}

.buttons{
    display:flex;
    gap:10px;
}

.save-btn,
.edit-btn,
.download-btn,
.back-btn{
    width:100%;
    min-height:52px;
    border:none;
    border-radius:18px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
}

.save-btn,
.download-btn{
    background:linear-gradient(135deg,#6366f1,#06b6d4);
}

.edit-btn,
.back-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
}

.download-btn,
.back-btn{
    margin-top:10px;
}

.save-btn:hover,
.edit-btn:hover,
.download-btn:hover,
.back-btn:hover{
    filter:brightness(1.08);
}

@media(max-width:600px){
    body{
        align-items:flex-start;
        padding:12px;
        background:
            radial-gradient(circle at top left,#4f46e5,#111827 62%),
            linear-gradient(135deg,#0f172a,#1e293b);
    }

    .details-box{
        width:100%;
        max-height:none;
        min-height:calc(100dvh - 24px);
        padding:24px 14px;
        border-radius:22px;
    }

    .phone{
        margin-bottom:20px;
    }

    .buttons{
        flex-direction:column;
    }

    .save-btn,
    .edit-btn,
    .download-btn,
    .back-btn{
        min-height:50px;
        border-radius:16px;
    }
}

@media(max-width:360px){
    body{
        padding:8px;
    }

    .details-box{
        min-height:calc(100dvh - 16px);
        padding:20px 10px;
        border-radius:18px;
    }

    .measurement-grid{
        min-width:330px;
    }

    .measurement-grid th,
    .measurement-grid td{
        padding:10px 8px;
    }
}
</style>
</head>

<body>

<div class="details-box">
    <h1 class="title" id="customerName"></h1>
    <p class="phone" id="customerPhone"></p>

    <div class="measurement-table">
        <table class="measurement-grid">
            <thead>
                <tr>
                    <th>#</th>
                    <th>size</th>
                    <th>name of the place</th>
                </tr>
            </thead>
            <tbody id="measurementRows"></tbody>
        </table>
    </div>

    <div class="measurement-total-row">
        <div class="measurement-total-box"><span id="measurementTotal">0</span></div>
        <div class="measurement-total-label">Ú©Û†ÛŒ Ú¯Ø´ØªÛŒ</div>
    </div>

    <div class="buttons">
        <button class="save-btn" onclick="saveMeasurements()">Save</button>
        <button class="edit-btn" onclick="editMeasurements()">Edit</button>
    </div>

    <button class="download-btn" onclick="downloadPDF()">Download PDF</button>
    <button class="back-btn" onclick="goBack()">Back</button>
</div>

<script src="./vendor/html2canvas.min.js"></script>
<script src="./vendor/jspdf.umd.min.js"></script>
<script src="./firebase-data.js"></script>

<script>
const isMobile = window.matchMedia("(max-width: 600px), (pointer: coarse)").matches;
document.documentElement.classList.add(isMobile ? "mobile-device" : "desktop-device");

let customers = JSON.parse(localStorage.getItem("measurementCustomers")) || [];
const selectedIndex = localStorage.getItem("selectedMeasurementIndex");
let measurements = [];
let rowCount = 0;

renderSelectedCustomer();
loadCustomers();

async function loadCustomers(){
    customers = await SivarFirebase.getMeasurementCustomers();
    renderSelectedCustomer();
}

function renderSelectedCustomer(){
    document.getElementById("measurementRows").innerHTML = "";
    rowCount = 0;

    if(selectedIndex !== null && customers[selectedIndex]){
    document.getElementById("customerName").innerText = customers[selectedIndex].name;
    document.getElementById("customerPhone").innerText = customers[selectedIndex].phone;

    measurements = customers[selectedIndex].measurements || [];

    if(measurements.length > 0){
        measurements.forEach(function(item){
            addRow(item.place, item.size, true);
        });
    }else{
        addRow("", "", false);
    }
}else{
    document.getElementById("customerName").innerText = "Customer not found";
    document.getElementById("customerPhone").innerText = "";
    addRow("", "", false);
}
}

function escapeHtml(value){
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function safeFileName(value){
    return String(value || "Customer")
        .trim()
        .replace(/[\\/:*?"<>|]/g, "-")
        .replace(/\s+/g, "-") || "Customer";
}

function cleanSizeText(text){
    return String(text || "").replace(/[^\d.]/g, "");
}

function parseSize(text){
    return parseFloat(cleanSizeText(text)) || 0;
}

function formatTotal(value){
    return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));
}

function calculateMeasurementTotal(){
    const total = Array.from(document.querySelectorAll(".size-cell"))
        .reduce(function(sum, cell){
            return sum + parseSize(cell.textContent);
        }, 0) * 4;

    document.getElementById("measurementTotal").textContent = formatTotal(total);
}

function moveCursorToEnd(cell){
    const range = document.createRange();
    const selection = window.getSelection();

    range.selectNodeContents(cell);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
}

function limitSizeCell(cell){
    const cleanText = cleanSizeText(cell.textContent);

    if(cell.textContent !== cleanText){
        cell.textContent = cleanText;
        moveCursorToEnd(cell);
    }
}

function addRow(placeValue, sizeValue, disabled){
    rowCount++;

    const row = document.createElement("tr");
    row.className = "table-row";

    row.innerHTML = `
        <td class="number-cell number">${rowCount}</td>
        <td class="size-cell" contenteditable="${disabled ? "false" : "true"}">${escapeHtml(sizeValue)}</td>
        <td class="place-cell" contenteditable="${disabled ? "false" : "true"}">${escapeHtml(placeValue)}</td>
    `;

    document.getElementById("measurementRows").appendChild(row);

    const placeCell = row.querySelector(".place-cell");
    const sizeCell = row.querySelector(".size-cell");

    sizeCell.addEventListener("input", function(){
        limitSizeCell(sizeCell);
        calculateMeasurementTotal();
    });

    placeCell.addEventListener("input", calculateMeasurementTotal);

    [sizeCell, placeCell].forEach(function(cell){
        cell.addEventListener("keydown", function(event){
            if(event.key !== "Enter"){
                return;
            }

            event.preventDefault();

            if(cell.contentEditable !== "true"){
                return;
            }

            const rows = Array.from(document.querySelectorAll(".table-row"));
            const isLastRow = row === rows[rows.length - 1];

            if(isLastRow){
                removeEmptyRows();
                const newRow = addRow("", "", false);
                newRow.querySelector(".size-cell").focus();
                return;
            }

            const nextRow = rows[rows.indexOf(row) + 1];
            nextRow.querySelector(cell.classList.contains("size-cell") ? ".size-cell" : ".place-cell").focus();
        });
    });

    calculateMeasurementTotal();

    return row;
}

function removeEmptyRows(){
    const rows = Array.from(document.querySelectorAll(".table-row"));

    rows.forEach(function(row){
        const place = row.querySelector(".place-cell").textContent.trim();
        const size = row.querySelector(".size-cell").textContent.trim();

        if(place === "" && size === "" && rows.length > 1){
            row.remove();
        }
    });

    updateNumbers();
}

function updateNumbers(){
    const numbers = document.querySelectorAll(".number");

    rowCount = 0;

    numbers.forEach(function(number){
        rowCount++;
        number.innerText = rowCount;
    });

    calculateMeasurementTotal();
}

async function saveMeasurements(showAlert = true){
    removeEmptyRows();

    const rows = document.querySelectorAll(".table-row");

    measurements = [];

    rows.forEach(function(row){
        const place = row.querySelector(".place-cell").textContent.trim();
        const size = row.querySelector(".size-cell").textContent.trim();

        if(place !== "" || size !== ""){
            measurements.push({
                place:place,
                size:size
            });
        }
    });

    if(measurements.length === 0){
        document.getElementById("measurementRows").innerHTML = "";
        rowCount = 0;
        addRow("", "", false);
    }

    if(selectedIndex !== null && customers[selectedIndex]){
        customers[selectedIndex].measurements = measurements;
        customers[selectedIndex].measurementTotal = document.getElementById("measurementTotal").textContent;
        await SivarFirebase.saveMeasurementCustomers(customers);
    }

    document.querySelectorAll(".size-cell, .place-cell").forEach(function(cell){
        cell.contentEditable = "false";
    });

    calculateMeasurementTotal();

    if(showAlert){
        alert("Measurements saved");
    }
}

function editMeasurements(){
    document.querySelectorAll(".size-cell, .place-cell").forEach(function(cell){
        cell.contentEditable = "true";
    });

    removeEmptyRows();

    const rows = document.querySelectorAll(".table-row");

    if(rows.length === 0){
        addRow("", "", false);
    }

    const lastSizeInput = document.querySelector(".table-row:last-child .size-cell");

    if(lastSizeInput){
        lastSizeInput.focus();
    }
}

async function downloadPDF(){
    await saveMeasurements(false);

    const customerName = document.getElementById("customerName").innerText || "Customer";
    const customerPhone = document.getElementById("customerPhone").innerText || "";
    const measurementRows = document.querySelectorAll(".table-row");
    const measurementTotal = document.getElementById("measurementTotal").textContent;

    let rows = "";

    measurementRows.forEach(function(row, index){
        const place = row.querySelector(".place-cell").textContent.trim();
        const size = row.querySelector(".size-cell").textContent.trim();

        if(place !== "" || size !== ""){
            rows += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${escapeHtml(size)}</td>
                    <td>${escapeHtml(place)}</td>
                </tr>
            `;
        }
    });

    if(rows === ""){
        rows = `
            <tr>
                <td colspan="3">No measurements added</td>
            </tr>
        `;
    }

    const whatsappIcon = `
        <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="16" fill="#25D366"/>
            <path fill="#fff" d="M23.47 19.37c-.39-.2-2.31-1.14-2.67-1.27-.36-.13-.62-.2-.88.2-.26.39-1.01 1.27-1.24 1.53-.23.26-.46.29-.85.1-.39-.2-1.65-.61-3.14-1.94-1.16-1.03-1.94-2.31-2.17-2.7-.23-.39-.02-.6.17-.79.18-.18.39-.46.59-.69.2-.23.26-.39.39-.65.13-.26.07-.49-.03-.69-.1-.2-.88-2.12-1.21-2.9-.32-.77-.64-.66-.88-.67h-.75c-.26 0-.69.1-1.05.49-.36.39-1.37 1.34-1.37 3.27s1.4 3.79 1.6 4.05c.2.26 2.76 4.21 6.69 5.9.94.4 1.67.64 2.24.82.94.3 1.8.26 2.48.16.76-.11 2.31-.94 2.64-1.86.33-.91.33-1.7.23-1.86-.1-.16-.36-.26-.75-.46z"/>
        </svg>
    `;

    const pdfDesign = document.createElement("div");

    pdfDesign.style.position = "fixed";
    pdfDesign.style.left = "-9999px";
    pdfDesign.style.top = "0";
    pdfDesign.style.width = "794px";

    pdfDesign.innerHTML = `
        <div id="pdfPage" style="
            position:relative;
            width:794px;
            min-height:1123px;
            padding:45px;
            font-family:'Segoe UI', Arial, sans-serif;
            background:
                radial-gradient(circle at top left,#4f46e5,#111827 55%),
                linear-gradient(135deg,#0f172a,#1e293b);
            color:white;
            overflow:hidden;
        ">
            <div style="
                position:relative;
                z-index:2;
                padding:30px;
                border-radius:24px;
                background:rgba(15,23,42,0.95);
                border:1px solid rgba(255,255,255,0.18);
            ">
                <div style="
                    display:grid;
                    grid-template-columns:90px 1fr 90px;
                    align-items:center;
                    gap:20px;
                    margin-bottom:30px;
                ">
                    <div style="
                        width:80px;
                        height:80px;
                        border-radius:14px;
                        background:white;
                        padding:8px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                    ">
                        <img src="barcode.jpg" style="
                            width:100%;
                            height:100%;
                            object-fit:contain;
                        ">
                    </div>

                    <div>
                        <h1 style="
                            text-align:center;
                            font-family:'Noto Naskh Arabic','Segoe UI',Arial,sans-serif;
                            font-size:42px;
                            line-height:1.15;
                            margin-bottom:8px;
                            color:#d4af37;
                            font-weight:700;
                            direction:rtl;
                        ">
                            ÙˆÛ•Ø³ØªØ§ Ø³ÛŒÚ¤Û•Ø±
                        </h1>

                        <div style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            gap:9px;
                            color:rgba(255,255,255,0.9);
                            font-size:20px;
                            font-weight:700;
                            direction:ltr;
                        ">
                            ${whatsappIcon}
                            <span>07504019519</span>
                        </div>
                    </div>

                    <div style="
                        width:80px;
                        height:80px;
                        border-radius:20px;
                        background:rgba(255,255,255,0.12);
                        border:1px solid rgba(255,255,255,0.2);
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        overflow:hidden;
                    ">
                        <img src="logo.jpg" style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                        ">
                    </div>
                </div>

                <div style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:16px;
                    margin-bottom:30px;
                ">
                    <div style="
                        padding:18px;
                        border-radius:18px;
                        background:rgba(255,255,255,0.1);
                        border:1px solid rgba(255,255,255,0.15);
                    ">
                        <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:6px;">
                            Name
                        </div>
                        <div style="font-size:20px;font-weight:700;">
                            ${escapeHtml(customerName)}
                        </div>
                    </div>

                    <div style="
                        padding:18px;
                        border-radius:18px;
                        background:rgba(255,255,255,0.1);
                        border:1px solid rgba(255,255,255,0.15);
                    ">
                        <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:6px;">
                            Phone
                        </div>
                        <div style="font-size:20px;font-weight:700;">
                            ${escapeHtml(customerPhone)}
                        </div>
                    </div>
                </div>

                <table style="
                    width:100%;
                    border-collapse:collapse;
                    overflow:hidden;
                    border-radius:18px;
                    direction:ltr;
                ">
                    <thead>
                        <tr style="background:linear-gradient(135deg,#6366f1,#06b6d4);">
                            <th style="padding:14px;text-align:center;width:70px;">#</th>
                            <th style="padding:14px;text-align:center;">size</th>
                            <th style="padding:14px;text-align:center;">name of the place</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${rows}
                    </tbody>
                </table>

                <div style="
                    display:flex;
                    align-items:center;
                    gap:14px;
                    margin-top:14px;
                    direction:ltr;
                ">
                    <div style="
                        min-width:130px;
                        padding:12px 18px;
                        border:2px solid rgba(255,255,255,0.75);
                        text-align:center;
                        font-weight:800;
                    ">
                        ${escapeHtml(measurementTotal)}
                    </div>
                    <div style="
                        font-family:'Noto Naskh Arabic','Segoe UI',Arial,sans-serif;
                        font-size:20px;
                        font-weight:800;
                        direction:rtl;
                    ">
                        Ú©Û†ÛŒ Ú¯Ø´ØªÛŒ
                    </div>
                </div>
            </div>
        </div>
    `;

    pdfDesign.querySelectorAll("td").forEach(function(td){
        td.style.padding = "14px";
        td.style.borderBottom = "1px solid rgba(255,255,255,0.15)";
        td.style.background = "rgba(255,255,255,0.06)";
        td.style.color = "white";
        td.style.fontSize = "15px";
        td.style.textAlign = "center";
    });

    document.body.appendChild(pdfDesign);

    try{
        if(document.fonts && document.fonts.ready){
            await document.fonts.ready;
        }

        await waitForImages(pdfDesign);

        const pdfPage = pdfDesign.firstElementChild;

        const canvas = await html2canvas(pdfPage,{
            scale:2,
            useCORS:true,
            backgroundColor:"#111827",
            scrollX:0,
            scrollY:0,
            windowWidth:794,
            windowHeight:1123
        });

        const imgData = canvas.toDataURL("image/jpeg", 0.98);
        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF("p", "mm", "a4");

        pdf.addImage(imgData, "JPEG", 0, 0, 210, 297);

        const fileName = safeFileName(customerName) + "-measurements.pdf";
        const pdfBlob = pdf.output("blob");
        const pdfUrl = URL.createObjectURL(pdfBlob);

        try{
            await SivarFirebase.uploadPdf("measurements", fileName, pdfBlob);
        }catch(error){
            console.error("Could not upload measurement PDF to Firebase Storage", error);
        }

        const link = document.createElement("a");
        link.href = pdfUrl;
        link.download = fileName;
        link.style.display = "none";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(function(){
            URL.revokeObjectURL(pdfUrl);
        }, 3000);

    }catch(error){
        console.error(error);
        alert("PDF Error. Make sure logo.jpg and barcode.jpg are in the same folder as this HTML file.");
    }finally{
        if(pdfDesign.parentNode){
            document.body.removeChild(pdfDesign);
        }
    }
}

function waitForImages(container){
    const images = Array.from(container.querySelectorAll("img"));

    if(images.length === 0){
        return Promise.resolve();
    }

    return Promise.all(images.map(function(img){
        return new Promise(function(resolve, reject){
            if(img.complete){
                resolve();
            }else{
                img.onload = resolve;
                img.onerror = reject;
            }
        });
    }));
}

function goBack(){
    window.location.href = "my_measurments.html";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>My Works</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(circle at top left,#4f46e5,#111827 55%),linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
    padding:30px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.page-title{
    font-size:38px;
    font-weight:800;
}

.main-btn,
.back-btn,
.small-btn{
    border:none;
    border-radius:16px;
    color:#fff;
    font-weight:800;
    cursor:pointer;
    transition:.25s ease;
}

.main-btn,
.back-btn{
    height:52px;
    padding:0 24px;
    font-size:15px;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    box-shadow:0 10px 25px rgba(99,102,241,0.28);
}

.main-btn:hover,
.back-btn:hover,
.small-btn:hover{
    transform:translateY(-2px);
}

.works-layout{
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
    gap:22px;
    align-items:start;
}

.side-panel,
.work-panel{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.13);
    border-radius:24px;
    padding:22px;
    box-shadow:0 16px 40px rgba(0,0,0,0.22);
}

.today-btn{
    width:100%;
    margin-bottom:18px;
}

.search-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.search-box{
    min-width:0;
    flex:1;
    height:48px;
    border:none;
    outline:none;
    border-radius:16px;
    padding:0 14px;
    color:#fff;
    font-size:15px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.15);
}

.search-box::placeholder{
    color:rgba(255,255,255,0.55);
}

.search-btn{
    height:48px;
    padding:0 14px;
    white-space:nowrap;
}

.date-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.date-btn{
    width:100%;
    min-height:48px;
    border:none;
    border-radius:16px;
    padding:10px 14px;
    text-align:left;
    color:#fff;
    font-weight:800;
    cursor:pointer;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.12);
}

.date-btn.active{
    background:linear-gradient(135deg,#6366f1,#06b6d4);
}

.panel-title{
    font-size:26px;
    font-weight:800;
    margin-bottom:18px;
}

.empty-box{
    padding:60px 20px;
    text-align:center;
    color:rgba(255,255,255,0.72);
    font-size:18px;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
    margin-bottom:18px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.16);
    background:linear-gradient(180deg,rgba(255,255,255,0.10),rgba(255,255,255,0.045));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 30px rgba(0,0,0,0.20);
}

table{
    width:100%;
    min-width:420px;
    border-collapse:collapse;
    background:transparent;
    table-layout:fixed;
}

th,
td{
    border-bottom:1px solid rgba(255,255,255,0.13);
    border-right:1px solid rgba(255,255,255,0.10);
    padding:13px 12px;
    color:#fff;
    vertical-align:top;
}

th:last-child,
td:last-child{
    border-right:none;
}

tr:last-child td{
    border-bottom:none;
}

th{
    text-transform:lowercase;
    font-size:14px;
    font-weight:800;
    letter-spacing:.02em;
    background:linear-gradient(135deg,rgba(99,102,241,0.92),rgba(6,182,212,0.82));
    color:#fff;
    text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
}

td{
    min-height:42px;
    outline:none;
    word-break:break-word;
    background:rgba(255,255,255,0.035);
    transition:background .2s ease, box-shadow .2s ease;
}

tr:nth-child(even) td{
    background:rgba(255,255,255,0.065);
}

tr:hover td{
    background:rgba(6,182,212,0.11);
}

.number-cell{
    width:12%;
    font-weight:700;
    text-align:center;
}

.description-cell[contenteditable="true"],
.cost-cell[contenteditable="true"]{
    outline:none;
    white-space:pre-wrap;
    word-break:break-word;
}

.description-cell[contenteditable="true"]:focus,
.cost-cell[contenteditable="true"]:focus{
    background:rgba(6,182,212,0.18);
    box-shadow:inset 0 0 0 2px rgba(6,182,212,0.42);
}

.cost-cell{
    width:28%;
    text-align:right;
    font-weight:800;
}

.small-btn{
    min-width:66px;
    height:38px;
    padding:0 12px;
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.add-btn{
    margin-top:18px;
    background:linear-gradient(135deg,#10b981,#06b6d4);
}

.total-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:12px;
    margin:4px 0 20px;
    font-size:16px;
    font-weight:900;
}

.total-box{
    min-width:160px;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,0.20);
    border-radius:16px;
    background:linear-gradient(135deg,rgba(99,102,241,0.24),rgba(6,182,212,0.18));
    text-align:center;
    font-weight:800;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 24px rgba(0,0,0,0.18);
}

.work-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.save-work-btn{
    background:linear-gradient(135deg,#10b981,#06b6d4);
}

.edit-work-btn{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}

@media(max-width:820px){
    body{padding:20px;}
    .works-layout{grid-template-columns:1fr;}
    .page-title{font-size:31px;}
    .back-btn,.main-btn{width:100%;}
    .search-row{flex-direction:column;}
}
</style>

<script src="./firebase-data.js?v=works1"></script>
</head>

<body>

<div class="top-bar">
    <h1 class="page-title">My Works</h1>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">Back To Dashboard</button>
</div>

<div class="works-layout">
    <div class="side-panel">
        <button class="main-btn today-btn" onclick="openTodayWork()">Today</button>
        <div class="search-row">
            <input
                type="date"
                id="dateSearchInput"
                class="search-box"
                onkeydown="handleDateSearchKey(event)"
            />
            <button class="main-btn search-btn" onclick="searchDates()">Search</button>
        </div>
        <div class="date-list" id="dateList"></div>
    </div>

    <div class="work-panel" id="workPanel">
        <div class="empty-box">Click Today to create today's work table, or open a saved date.</div>
    </div>
</div>

<script>
const dateList = document.getElementById("dateList");
const workPanel = document.getElementById("workPanel");
const dateSearchInput = document.getElementById("dateSearchInput");

let works = [];
let activeDate = "";
let activeEditMode = false;
let dateSearchValue = "";

function getTodayKey(){
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}

function formatDateLabel(dateKey){
    return dateKey.replace(/-/g, "/");
}

function parseCost(value){
    return parseFloat(String(value || "").replace(/[^\d.]/g, "")) || 0;
}

function formatCost(value){
    return value ? value.toLocaleString() : "0";
}

function getActiveWork(){
    return works.find(work => work.date === activeDate);
}

function ensureAtLeastOneRow(work){
    if(!Array.isArray(work.rows) || work.rows.length === 0){
        work.rows = [];
    }

    while(activeEditMode && work.rows.length < 4){
        work.rows.push({ description:"", cost:"" });
    }
}

function rowHasWorkText(row){
    return Boolean(
        String(row.description || "").trim() ||
        String(row.cost || "").trim()
    );
}

function normalizeWorksByDate(){
    const mergedWorks = [];

    works.forEach(work => {
        if(!work || !work.date){
            return;
        }

        const existingWork = mergedWorks.find(item => item.date === work.date);
        const rows = Array.isArray(work.rows) ? work.rows : [];

        if(existingWork){
            existingWork.rows = existingWork.rows.concat(rows);
            return;
        }

        mergedWorks.push({
            ...work,
            rows: [...rows]
        });
    });

    works = mergedWorks;
}

function removeEmptyRows(work){
    work.rows = (Array.isArray(work.rows) ? work.rows : []).filter(rowHasWorkText);
}

function renderDateList(){
    dateList.innerHTML = "";

    const normalizedSearch = dateSearchValue.replace(/\//g, "-").trim();
    const sortedWorks = [...works]
        .filter(work => !normalizedSearch || work.date.includes(normalizedSearch))
        .sort((a, b) => b.date.localeCompare(a.date));

    if(sortedWorks.length === 0){
        dateList.innerHTML = `<div class="empty-box">No saved date found.</div>`;
        return;
    }

    sortedWorks.forEach(work => {
        const button = document.createElement("button");
        button.className = "date-btn" + (work.date === activeDate ? " active" : "");
        button.textContent = formatDateLabel(work.date);
        button.onclick = function(){
            activeDate = work.date;
            activeEditMode = false;
            renderDateList();
            renderWorkTable();
        };

        dateList.appendChild(button);
    });
}

function searchDates(){
    dateSearchValue = dateSearchInput.value.trim();
    renderDateList();
}

function handleDateSearchKey(event){
    if(event.key === "Enter"){
        event.preventDefault();
        searchDates();
    }
}

function renderWorkTable(){
    const work = getActiveWork();

    if(!work){
        workPanel.innerHTML = `<div class="empty-box">Click Today to create today's work table, or open a saved date.</div>`;
        return;
    }

    ensureAtLeastOneRow(work);

    workPanel.innerHTML = `
        <div class="panel-title">${formatDateLabel(work.date)}</div>
        <div class="table-wrap">
            <table>
                <colgroup>
                    <col style="width:12%">
                    <col style="width:60%">
                    <col style="width:28%">
                </colgroup>
                <thead>
                    <tr>
                        <th class="number-cell">#</th>
                        <th>discription</th>
                        <th>cost</th>
                    </tr>
                </thead>
                <tbody id="workRows"></tbody>
            </table>
        </div>
        <div class="total-row">
            <div class="total-box">total: <span id="workTotal">0</span></div>
        </div>
        <div class="work-actions">
            <button class="main-btn save-work-btn" onclick="saveCurrentWork()">Save</button>
            <button class="main-btn edit-work-btn" onclick="enableEditMode()">Edit</button>
        </div>
    `;

    renderRows();
}

function renderRows(){
    const work = getActiveWork();
    const rowsContainer = document.getElementById("workRows");

    if(!work || !rowsContainer){
        return;
    }

    rowsContainer.innerHTML = "";

    work.rows.forEach((row, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td class="number-cell">${index + 1}</td>
            <td class="description-cell" contenteditable="${activeEditMode}" data-index="${index}" data-field="description"></td>
            <td class="cost-cell" contenteditable="${activeEditMode}" data-index="${index}" data-field="cost"></td>
        `;

        rowsContainer.appendChild(tr);

        tr.querySelector('[data-field="description"]').innerText = row.description || "";
        tr.querySelector('[data-field="cost"]').innerText = row.cost || "";
    });

    rowsContainer.querySelectorAll("[contenteditable='true']").forEach(cell => {
        cell.addEventListener("input", function(){
            const index = Number(this.dataset.index);
            const field = this.dataset.field;
            const activeWork = getActiveWork();

            if(!activeWork || !activeWork.rows[index]){
                return;
            }

            if(field === "cost"){
                const cleaned = this.innerText.replace(/[^\d.]/g, "");
                if(this.innerText !== cleaned){
                    this.innerText = cleaned;
                    moveCursorToEnd(this);
                }
            }

            activeWork.rows[index][field] = this.innerText.trim();
            updateTotal();
        });

        cell.addEventListener("keydown", function(event){
            if(event.key !== "Enter"){
                return;
            }

            event.preventDefault();

            const currentIndex = Number(this.dataset.index);
            const field = this.dataset.field;
            const activeWork = getActiveWork();

            if(!activeWork){
                return;
            }

            const nextIndex = currentIndex + 1;
            const cellIndex = field === "cost" ? 1 : 0;

            if(nextIndex >= activeWork.rows.length){
                addWorkRow(cellIndex);
                return;
            }

            focusWorkCell(nextIndex, cellIndex);
        });
    });

    updateTotal();
}

async function saveCurrentWork(){
    const work = getActiveWork();

    if(!work){
        return;
    }

    removeEmptyRows(work);
    activeEditMode = false;
    await saveWorks();
    renderDateList();
    renderWorkTable();
}

function enableEditMode(){
    const work = getActiveWork();

    if(!work){
        return;
    }

    activeEditMode = true;
    ensureAtLeastOneRow(work);
    renderWorkTable();
}

function focusWorkCell(rowIndex, cellIndex){
    const row = document.querySelectorAll("#workRows tr")[rowIndex];

    if(!row){
        return;
    }

    const editableCells = row.querySelectorAll("[contenteditable='true']");
    const targetCell = editableCells[cellIndex];

    if(targetCell){
        targetCell.focus();
        moveCursorToEnd(targetCell);
    }
}

function moveCursorToEnd(element){
    const range = document.createRange();
    const selection = window.getSelection();

    range.selectNodeContents(element);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
}

function updateTotal(){
    const work = getActiveWork();
    const totalElement = document.getElementById("workTotal");

    if(!work || !totalElement){
        return;
    }

    const total = work.rows.reduce((sum, row) => sum + parseCost(row.cost), 0);
    totalElement.innerText = formatCost(total);
}

async function saveWorks(){
    await SivarFirebase.saveWorks(works);
}

async function openTodayWork(){
    const todayKey = getTodayKey();
    normalizeWorksByDate();
    let work = works.find(item => item.date === todayKey);

    if(!work){
        work = {
            date: todayKey,
            rows: [{ description:"", cost:"" }]
        };
        activeEditMode = true;
        ensureAtLeastOneRow(work);

        works.push(work);
        await saveWorks();
    }else{
        activeEditMode = false;
    }

    activeDate = todayKey;
    await saveWorks();
    renderDateList();
    renderWorkTable();
}

async function addWorkRow(focusCellIndex){
    const work = getActiveWork();

    if(!work){
        return;
    }

    work.rows.push({ description:"", cost:"" });
    renderRows();

    if(typeof focusCellIndex === "number"){
        focusWorkCell(work.rows.length - 1, focusCellIndex);
    }
}

async function deleteWorkRow(index){
    const work = getActiveWork();

    if(!work){
        return;
    }

    work.rows.splice(index, 1);
    ensureAtLeastOneRow(work);
    await saveWorks();
    renderRows();
}

async function loadWorks(){
    works = await SivarFirebase.getWorks();
    normalizeWorksByDate();
    await saveWorks();
    renderDateList();
}

loadWorks();
</script>

</body>
</html>

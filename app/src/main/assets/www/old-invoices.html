function numberToKurdish(num){

    num = Number(String(num).replace(/,/g,'')) || 0;

    const ones = ["","یەک","دوو","سێ","چوار","پێنج","شەش","حەوت","هەشت","نۆ"];
    const teens = ["دە","یازدە","دوازدە","سیازدە","چواردە","پازدە","شازدە","حەڤدە","هەژدە","نۆزدە"];
    const tens = ["","","بیست","سی","چل","پەنجا","شەست","حەفتا","هەشتا","نەوەد"];

    if(num === 0) return "";
    if(num < 10) return ones[num];
    if(num < 20) return teens[num - 10];

    if(num < 100){
        const t = Math.floor(num / 10);
        const o = num % 10;
        return o === 0 ? tens[t] : tens[t] + " و " + ones[o];
    }

    if(num < 1000){
        const h = Math.floor(num / 100);
        const rest = num % 100;
        let text = h === 1 ? "سەد" : ones[h] + " سەد";
        if(rest > 0) text += " و " + numberToKurdish(rest);
        return text;
    }

    if(num < 1000000){
        const th = Math.floor(num / 1000);
        const rest = num % 1000;
        let text = numberToKurdish(th) + " هەزار";
        if(rest > 0) text += " و " + numberToKurdish(rest);
        return text;
    }

    if(num < 1000000000){
        const mil = Math.floor(num / 1000000);
        const rest = num % 1000000;
        let text = numberToKurdish(mil) + " ملیۆن";
        if(rest > 0) text += " و " + numberToKurdish(rest);
        return text;
    }

    return num.toLocaleString();
}

function renderInvoices(data){

    invoiceList.innerHTML = "";

    if(data.length === 0){
        invoiceList.innerHTML = `<div class="empty-box">No invoices found</div>`;
        return;

    [...data].reverse().forEach((invoice)=>{

        const card = document.createElement("div");
        card.className = "invoice-card";

        card.innerHTML = `
            <div class="invoice-top">
                <div class="invoice-number">No: ${invoice.number}</div>
                <div class="invoice-date">${invoice.date}</div>
            </div>

                    <div class="info-value">${invoice.customerName || "-"}</div>

                </div>

                </div>

                    <div class="info-value">${invoice.total || "-"}</div>
                </div>
            </div>

function escapeHTML(value){
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function savePdfToPhone(pdf, fileName){
    if(window.AndroidPdf && window.AndroidPdf.startPdfSave){
        const base64Pdf = pdf.output("datauristring").split(",")[1];
        const chunkSize = 60000;

        window.AndroidPdf.startPdfSave(fileName);

        for(let index = 0; index < base64Pdf.length; index += chunkSize){
            window.AndroidPdf.appendPdfChunk(base64Pdf.slice(index, index + chunkSize));
        }

        window.AndroidPdf.finishPdfSave();
        return;
    }

    if(window.AndroidPdf && window.AndroidPdf.saveBase64){
        window.AndroidPdf.saveBase64(pdf.output("datauristring"), fileName);
        return;
    }

    pdf.save(fileName);
}

function waitForImages(container){
    const images = Array.from(container.querySelectorAll("img"));

    if(images.length === 0){
        return Promise.resolve();
    }

    return Promise.all(images.map(function(img){
        return new Promise(function(resolve, reject){
            if(img.complete && img.naturalWidth > 0){
                resolve();
            }else{
                img.onload = resolve;
                img.onerror = reject;
            }
        });
    }));
}

function readBlobAsDataURL(blob){
    return new Promise(function(resolve, reject){
        const reader = new FileReader();
        reader.onload = function(){
            resolve(reader.result);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

function loadImageAsDataURL(src){
    return new Promise(function(resolve, reject){
        const xhr = new XMLHttpRequest();
        xhr.open("GET", src, true);
        xhr.responseType = "blob";
        xhr.onload = async function(){
            if(xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)){
                try{
                    resolve(await readBlobAsDataURL(xhr.response));
                }catch(error){
                    reject(error);
                }
            }else{
                reject(new Error("Could not load image: " + src));
            }
        };
        xhr.onerror = function(){
            reject(new Error("Could not load image: " + src));
        };
        xhr.send();
    });
}

async function inlineImagesForCanvas(container){
    const images = Array.from(container.querySelectorAll("img"));

    await Promise.all(images.map(async function(img){
        const src = img.getAttribute("src");

        if(!src || src.indexOf("data:") === 0){
            return;
        }

        img.src = await loadImageAsDataURL(img.src);
    }));

    await waitForImages(container);
}

async function downloadInvoicePDF(invoiceNumber){

    const invoice = invoices.find(item => Number(item.number) === Number(invoiceNumber));

    if(!invoice){
        alert("Invoice not found");
        return;
    }

    const container = document.createElement("div");

    try{
        container.style.position = "absolute";
        container.style.left = "0";
        container.style.top = "0";
        container.style.width = "900px";
        container.style.zIndex = "-1";
        container.style.pointerEvents = "none";

        container.innerHTML = generateInvoiceHTMLV2(invoice);

        document.body.appendChild(container);

        if(document.fonts && document.fonts.ready){
            await document.fonts.ready;
        }

        await inlineImagesForCanvas(container);

        const invoiceDesign = container.querySelector("#invoiceDesign");
        const canvas = await html2canvas(invoiceDesign,{
            scale:2,
            useCORS:true,
            allowTaint:false,
            backgroundColor:"#ffffff",
            scrollX:0,
            scrollY:0,
            windowWidth:900,
            windowHeight:invoiceDesign.scrollHeight || 1273,
            imageTimeout:15000
        });

        const imgData = canvas.toDataURL("image/jpeg", 0.95);

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF("p","mm","a4");

        const pageWidth = 210;
        const pageHeight = 297;
        const margin = 6;
        const usableWidth = pageWidth - margin * 2;
        const usableHeight = pageHeight - margin * 2;

        let imgWidth = usableWidth;
        let imgHeight = (canvas.height * imgWidth) / canvas.width;

        if(imgHeight > usableHeight){
            imgHeight = usableHeight;
            imgWidth = (canvas.width * imgHeight) / canvas.height;
        }

        const x = (pageWidth - imgWidth) / 2;
        const y = (pageHeight - imgHeight) / 2;

        pdf.addImage(imgData,"JPEG",x,y,imgWidth,imgHeight);

        const fileName = "carpet-invoice-" + invoice.number + ".pdf";

        savePdfToPhone(pdf, fileName);
    }catch(error){
        console.error(error);
        alert("PDF save error: " + (error && error.message ? error.message : error));
    }finally{
        if(container.parentNode){
            document.body.removeChild(container);
        }
    }
}

async function deleteInvoice(invoiceNumber){

    const confirmDelete = confirm("Delete invoice No: " + invoiceNumber + " ?");

    if(!confirmDelete) return;

    invoices = invoices.filter(invoice => Number(invoice.number) !== Number(invoiceNumber));

    await SivarFirebase.saveInvoices(invoices);

    renderInvoices(invoices);
}

});

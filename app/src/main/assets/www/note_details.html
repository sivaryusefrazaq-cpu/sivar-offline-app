<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Note Details</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:
        radial-gradient(circle at top left,#4f46e5,#111827 55%),
        linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
    padding:20px;
}

body::before,
body::after{
    content:'';
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    z-index:0;
}

body::before{
    background:#6366f1;
    top:-100px;
    left:-100px;
}

body::after{
    background:#06b6d4;
    bottom:-120px;
    right:-120px;
}

.container{
    position:relative;
    z-index:2;
    width:520px;
    max-width:100%;
    margin:40px auto;
    padding:35px 28px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 10px 40px rgba(0,0,0,0.4),
        inset 0 1px 1px rgba(255,255,255,0.15);
}

.title{
    text-align:center;
    font-size:34px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:rgba(255,255,255,0.7);
    margin-bottom:28px;
    font-size:15px;
}

.search-box,
.input-box,
.note-box{
    width:100%;
    border:none;
    outline:none;
    border-radius:16px;
    padding:15px 16px;
    font-size:16px;
    color:#fff;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.16);
    margin-bottom:16px;
}

.search-box::placeholder,
.input-box::placeholder,
.note-box::placeholder{
    color:rgba(255,255,255,0.55);
}

.note-box{
    min-height:160px;
    resize:vertical;
    line-height:1.5;
}

.btn-row{
    display:flex;
    gap:12px;
    margin-bottom:18px;
}

.main-btn,
.back-btn,
.save-btn,
.cancel-btn,
.currency-btn{
    border:none;
    border-radius:16px;
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
    padding:14px 16px;
}

.main-btn,
.save-btn{
    flex:1;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    box-shadow:0 10px 25px rgba(99,102,241,0.35);
}

.back-btn,
.cancel-btn{
    flex:1;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
}

.main-btn:hover,
.save-btn:hover,
.back-btn:hover,
.cancel-btn:hover{
    transform:translateY(-2px);
    background-color:rgba(255,255,255,0.14);
}

.form-box{
    display:none;
    margin-bottom:18px;
}

.name-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.name-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px;
    border-radius:18px;
    background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.14);
}

.name-info{
    flex:1;
    cursor:pointer;
    min-width:0;
}

.currency-btn{
    width:50px;
    min-width:50px;
    background:linear-gradient(135deg,#17b26a,#087443);
    box-shadow:0 10px 22px rgba(8,116,67,0.28);
}

.currency-btn.active{
    background:linear-gradient(135deg,#f59e0b,#b45309);
    box-shadow:0 10px 22px rgba(180,83,9,0.28);
}

.name-title-row{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:6px 10px;
}

.name-info h3{
    font-size:18px;
    word-break:break-word;
}

.saved-date{
    color:rgba(255,255,255,0.62);
    font-size:13px;
    line-height:1.4;
}

.name-info p{
    color:rgba(255,255,255,0.65);
    font-size:14px;
    margin-top:4px;
    word-break:break-word;
}

.icon-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.icon-btn,
.map-btn{
    width:56px;
    height:56px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    color:#fff;
    font-size:24px;
    transition:.25s ease;
    touch-action:manipulation;
}

.icon-btn:hover,
.map-btn:hover{
    filter:brightness(1.12);
}

.edit-btn{
    background:rgba(6,182,212,0.25);
    border:1px solid rgba(6,182,212,0.4);
}

.delete-btn{
    background:rgba(239,68,68,0.25);
    border:1px solid rgba(239,68,68,0.4);
}

.map-btn.google{
    background:rgba(66,133,244,0.28);
    border-color:rgba(66,133,244,0.42);
}

.map-btn.waze{
    background:rgba(51,204,255,0.24);
    border-color:rgba(51,204,255,0.42);
}

.map-btn svg{
    width:22px;
    height:22px;
    display:block;
    margin:auto;
}

.empty-message{
    text-align:center;
    color:rgba(255,255,255,0.65);
    margin-top:22px;
    font-size:15px;
}

.details-view{
    display:none;
}

.details-header{
    margin-bottom:18px;
}

.details-title-row{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px 12px;
    margin-bottom:6px;
}

.details-header h2{
    font-size:28px;
    word-break:break-word;
}

.details-date{
    min-width:150px;
    color:rgba(255,255,255,0.72);
    font-size:14px;
    line-height:1.4;
    padding:4px 8px;
    border-radius:10px;
    border:1px solid transparent;
    outline:none;
}

.details-date[contenteditable="true"]{
    cursor:text;
    border-color:rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.08);
}

.details-date[contenteditable="true"]:focus{
    border-color:rgba(6,182,212,0.8);
    background:rgba(255,255,255,0.12);
}

.details-header p{
    color:rgba(255,255,255,0.7);
    word-break:break-word;
}

.note-table-wrap{
    width:100%;
    overflow-x:auto;
    margin-bottom:18px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.16);
    background:linear-gradient(180deg,rgba(255,255,255,0.10),rgba(255,255,255,0.045));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 30px rgba(0,0,0,0.20);
}

.note-table{
    width:100%;
    min-width:420px;
    border-collapse:collapse;
    background:transparent;
}

.note-table th,
.note-table td{
    border-bottom:1px solid rgba(255,255,255,0.13);
    border-right:1px solid rgba(255,255,255,0.10);
    padding:13px 12px;
    color:#fff;
}

.note-table th:last-child,
.note-table td:last-child{
    border-right:none;
}

.note-table tr:last-child td{
    border-bottom:none;
}

.note-table th{
    text-transform:lowercase;
    font-size:14px;
    font-weight:800;
    letter-spacing:.02em;
    background:linear-gradient(135deg,rgba(99,102,241,0.92),rgba(6,182,212,0.82));
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.2);
}

.note-table td{
    min-height:42px;
    outline:none;
    vertical-align:top;
    word-break:break-word;
    background:rgba(255,255,255,0.035);
    transition:background .2s ease, box-shadow .2s ease;
}

.note-table tr:nth-child(even) td{
    background:rgba(255,255,255,0.065);
}

.note-table tr:hover td{
    background:rgba(6,182,212,0.11);
}

.note-table td[contenteditable="true"]:focus{
    background:rgba(6,182,212,0.18);
    box-shadow:inset 0 0 0 2px rgba(6,182,212,0.42);
}

.description-cell{
    width:55%;
    text-align:left;
}

.number-cell{
    width:22.5%;
    text-align:center;
    font-weight:700;
}

.total-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:12px;
    margin:4px 0 20px;
}

.total-box{
    min-width:160px;
    padding:12px 18px;
    border:1px solid rgba(255,255,255,0.20);
    border-radius:16px;
    background:linear-gradient(135deg,rgba(99,102,241,0.24),rgba(6,182,212,0.18));
    text-align:center;
    font-weight:800;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.14), 0 12px 24px rgba(0,0,0,0.18);
}

@media(max-width:480px){
    .container{
        margin:20px auto;
        padding:28px 20px;
    }

    .title{
        font-size:28px;
    }

    .btn-row{
        flex-direction:column;
    }

    .name-card{
        align-items:flex-start;
        flex-direction:column;
    }

    .icon-buttons{
        width:100%;
    }

    .icon-btn,
    .map-btn{
        flex:1;
    }

    .total-row{
        align-items:stretch;
        flex-direction:column;
    }

    .currency-btn{
        width:100%;
    }
}
</style>
<script src="./firebase-data.js"></script>
</head>

<body>

<div class="container">

    <div id="listView">
        <h1 class="title">Notes</h1>
        <p class="subtitle">Save names, phone numbers, and notes</p>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Search by name or phone number..."
            oninput="showNames()"
        />

        <div class="btn-row">
            <button class="main-btn" onclick="showForm()">New Name</button>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Back</button>
        </div>

        <div class="form-box" id="formBox">
            <input
                type="text"
                id="nameInput"
                class="input-box"
                placeholder="Enter name"
            />

            <input
                type="tel"
                id="phoneInput"
                class="input-box"
                placeholder="Enter phone number"
            />

            <div class="btn-row">
                <button class="save-btn" onclick="saveName()">Save</button>
                <button class="cancel-btn" onclick="hideForm()">Cancel</button>
            </div>
        </div>

        <div class="name-list" id="nameList"></div>

        <p class="empty-message" id="emptyMessage">No names saved yet.</p>
    </div>

    <div class="details-view" id="detailsView">
        <div class="details-header">
            <div class="details-title-row">
                <h2 id="detailsName"></h2>
                <span
                    id="detailsSavedDate"
                    class="details-date"
                    contenteditable="true"
                    title="Edit saved date"
                ></span>
            </div>
            <p id="detailsPhone"></p>
        </div>

        <textarea
            id="noteInput"
            class="note-box"
            placeholder="Write your note here..."
        ></textarea>

        <div class="note-table-wrap">
            <table class="note-table" id="noteTable">
                <thead>
                    <tr>
                        <th>description</th>
                        <th>meters</th>
                        <th>cost</th>
                    </tr>
                </thead>
                <tbody id="noteRows"></tbody>
            </table>
        </div>

        <div class="total-row">
            <button
                class="currency-btn"
                id="noteCurrencyBtn"
                onclick="toggleNoteCurrency()"
                title="Toggle dollar / dinar"
            >$</button>
            <div class="total-box">total: <span id="noteTotal">0</span></div>
        </div>

        <div class="btn-row">
            <button class="save-btn" onclick="saveNote()">Save Note</button>
            <button class="main-btn" onclick="editCurrentName()">Edit</button>
        </div>

        <div class="btn-row">
            <button class="cancel-btn" onclick="deleteCurrentName()">Delete</button>
            <button class="back-btn" onclick="backToList()">Back</button>
        </div>
    </div>

</div>

<script>
let notes = JSON.parse(localStorage.getItem('notesData')) || [];
let editIndex = null;
let currentIndex = null;
let noteCurrencyMode = 'IQD';

function getSavedStamp(){
    return new Date().toISOString();
}

function formatSavedDate(savedAt){
    if(!savedAt){
        return 'Saved date not recorded';
    }

    const date = new Date(savedAt);

    if(Number.isNaN(date.getTime())){
        return 'Saved date not recorded';
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const dayName = date.toLocaleDateString('en-US', { weekday:'long' });

    return `${year}/${month}/${day} ${dayName}`;
}

function getNoteSavedDate(note){
    return note.savedDateText || formatSavedDate(note.savedAt);
}

function getCurrentLocation(){
    if(!navigator.geolocation){
        return Promise.resolve(null);
    }

    return new Promise(resolve => {
        let bestPosition = null;
        let resolved = false;
        let watchId = null;

        function locationData(position){
            return {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                savedAt: getSavedStamp()
            };
        }

        function isBetterPosition(position){
            if(!bestPosition){
                return true;
            }

            return Number(position.coords.accuracy || Infinity) < Number(bestPosition.coords.accuracy || Infinity);
        }

        function finish(){
            if(resolved){
                return;
            }

            resolved = true;

            if(watchId !== null){
                navigator.geolocation.clearWatch(watchId);
            }

            resolve(bestPosition ? locationData(bestPosition) : null);
        }

        watchId = navigator.geolocation.watchPosition(
            position => {
                if(isBetterPosition(position)){
                    bestPosition = position;
                }

                if(position.coords.accuracy && position.coords.accuracy <= 15){
                    finish();
                }
            },
            () => finish(),
            {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 0
            }
        );

        navigator.geolocation.getCurrentPosition(
            position => {
                if(isBetterPosition(position)){
                    bestPosition = position;
                }

                if(position.coords.accuracy && position.coords.accuracy <= 15){
                    finish();
                }
            },
            () => {},
            {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 0
            }
        );

        setTimeout(finish, 22000);
    });
}

function hasLocation(note){
    return note && Number.isFinite(Number(note.latitude)) && Number.isFinite(Number(note.longitude));
}

function googleMapsUrl(note){
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(note.latitude + ',' + note.longitude)}`;
}

function wazeUrl(note){
    return `https://waze.com/ul?ll=${encodeURIComponent(note.latitude + ',' + note.longitude)}&navigate=yes`;
}

function openMap(event, url){
    event.stopPropagation();
    window.open(url, '_blank');
}

const googleMapIcon = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#34A853" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/>
        <path fill="#FBBC04" d="M7.1 4.1A7 7 0 0 0 5 9c0 2.1 1.1 4.8 2.5 7.1L12 9 7.1 4.1z"/>
        <path fill="#4285F4" d="M16.9 4.1 12 9l4.5 7.1C17.9 13.8 19 11.1 19 9a7 7 0 0 0-2.1-4.9z"/>
        <path fill="#EA4335" d="M12 2c1.9 0 3.6.8 4.9 2.1L12 9 7.1 4.1A7 7 0 0 1 12 2z"/>
        <circle cx="12" cy="9" r="2.4" fill="#fff"/>
    </svg>
`;

const wazeIcon = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#8EE7FF" d="M20.6 10.3c0-4.1-3.5-7.4-8.1-7.4S4.4 6.2 4.4 10.3c0 .9.2 1.8.5 2.6-.8.2-1.5.8-1.5 1.7 0 1 .8 1.8 1.8 1.8.4 0 .8-.1 1.1-.4 1.4 1.1 3.2 1.7 5.2 1.7h4.8c2.4 0 4.3-1.9 4.3-4.3v-3.1z"/>
        <path fill="#0F172A" d="M10 9.1a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm6 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-1.5 3.2c-.6.7-1.5 1.1-2.5 1.1s-1.9-.4-2.5-1.1c-.2-.2-.6-.2-.8 0-.2.2-.2.6 0 .8.8.9 2 1.4 3.3 1.4s2.5-.5 3.3-1.4c.2-.2.2-.6 0-.8-.2-.2-.6-.2-.8 0z"/>
        <circle cx="8" cy="19.4" r="1.7" fill="#0F172A"/>
        <circle cx="16" cy="19.4" r="1.7" fill="#0F172A"/>
    </svg>
`;

function cleanNumberText(text){
    return String(text || '').replace(/[^\d.]/g, '');
}

function parseMoney(text){
    return parseFloat(cleanNumberText(text)) || 0;
}

function formatMoney(value){
    if(!value){
        return '0';
    }

    const formattedValue = value.toLocaleString();
    return noteCurrencyMode === 'USD' ? '$' + formattedValue : formattedValue;
}

function updateNoteCurrencyUI(){
    const button = document.getElementById('noteCurrencyBtn');

    if(!button){
        return;
    }

    const isDollar = noteCurrencyMode === 'USD';
    button.textContent = isDollar ? 'د' : '$';
    button.classList.toggle('active', isDollar);
    button.title = isDollar ? 'Change to dinar' : 'Change to dollar';
}

function toggleNoteCurrency(){
    noteCurrencyMode = noteCurrencyMode === 'IQD' ? 'USD' : 'IQD';
    updateNoteCurrencyUI();
    calculateNoteTotal();
}

function normalizeNoteRows(note){
    if(Array.isArray(note.noteRows) && note.noteRows.length > 0){
        return note.noteRows;
    }

    return [{ description:'', meters:'', cost:'' }];
}

function addNoteRow(rowData = {}){
    const noteRows = document.getElementById('noteRows');
    const row = document.createElement('tr');

    row.innerHTML = `
        <td class="description-cell" contenteditable="true">${escapeHTML(rowData.description || '')}</td>
        <td class="number-cell meters-cell" contenteditable="true">${escapeHTML(rowData.meters || '')}</td>
        <td class="number-cell cost-cell" contenteditable="true">${escapeHTML(rowData.cost || '')}</td>
    `;

    attachNoteRowEvents(row);
    noteRows.appendChild(row);

    return row;
}

function renderNoteRows(note){
    const noteRows = document.getElementById('noteRows');
    noteRows.innerHTML = '';

    normalizeNoteRows(note).forEach(rowData => addNoteRow(rowData));
    calculateNoteTotal();
}

function rowHasNoteText(row){
    return Array.from(row.cells).some(cell => cell.textContent.trim());
}

function collectNoteRows(){
    return Array.from(document.querySelectorAll('#noteRows tr'))
        .filter(row => rowHasNoteText(row))
        .map(row => ({
            description: row.cells[0].textContent.trim(),
            meters: row.cells[1].textContent.trim(),
            cost: row.cells[2].textContent.trim()
        }));
}

function calculateNoteTotal(){
    const total = collectNoteRows().reduce((sum, row) => {
        return sum + (parseMoney(row.meters) * parseMoney(row.cost));
    }, 0);

    document.getElementById('noteTotal').textContent = formatMoney(total);
}

function moveCursorToEnd(cell){
    const range = document.createRange();
    const selection = window.getSelection();

    range.selectNodeContents(cell);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
}

function limitNumberCell(cell){
    const cleanText = cleanNumberText(cell.textContent);

    if(cell.textContent !== cleanText){
        cell.textContent = cleanText;
        moveCursorToEnd(cell);
    }
}

function attachNoteRowEvents(row){
    Array.from(row.cells).forEach((cell, cellIndex) => {
        cell.addEventListener('input', () => {
            if(cellIndex > 0){
                limitNumberCell(cell);
            }

            calculateNoteTotal();
        });

        cell.addEventListener('keydown', event => {
            if(event.key !== 'Enter'){
                return;
            }

            event.preventDefault();

            const rows = Array.from(document.querySelectorAll('#noteRows tr'));
            const isLastRow = row === rows[rows.length - 1];

            if(isLastRow){
                const newRow = addNoteRow();
                newRow.cells[0].focus();
                return;
            }

            const nextRow = rows[rows.indexOf(row) + 1];
            nextRow.cells[Math.min(cellIndex, 2)].focus();
        });
    });
}

loadNotes();

async function loadNotes(){
    notes = await SivarFirebase.getNotes();
    showNames();
}

async function saveToStorage(){
    await SivarFirebase.saveNotes(notes);
}

function showForm(){
    document.getElementById('formBox').style.display = 'block';
    document.getElementById('nameInput').focus();
}

function hideForm(){
    document.getElementById('formBox').style.display = 'none';
    document.getElementById('nameInput').value = '';
    document.getElementById('phoneInput').value = '';
    editIndex = null;
}

async function saveName(){
    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();

    if(name === '' || phone === ''){
        alert('Please enter name and phone number.');
        return;
    }

    const savedAt = getSavedStamp();
    const savedDateText = formatSavedDate(savedAt);
    const location = editIndex === null ? await getCurrentLocation() : null;

    if(editIndex === null){
        notes.push({
            name: name,
            phone: phone,
            note: '',
            noteRows: [{ description:'', meters:'', cost:'' }],
            noteCurrency: 'IQD',
            savedAt: savedAt,
            savedDateText: savedDateText,
            latitude: location ? location.latitude : null,
            longitude: location ? location.longitude : null,
            locationAccuracy: location ? location.accuracy : null,
            locationSavedAt: location ? location.savedAt : null
        });
    }else{
        notes[editIndex].name = name;
        notes[editIndex].phone = phone;

        if(!notes[editIndex].savedAt){
            notes[editIndex].savedAt = savedAt;
        }

        if(!notes[editIndex].savedDateText){
            notes[editIndex].savedDateText = formatSavedDate(notes[editIndex].savedAt);
        }
    }

    await saveToStorage();
    hideForm();
    showNames();
}

function showNames(){
    const nameList = document.getElementById('nameList');
    const emptyMessage = document.getElementById('emptyMessage');
    const searchValue = document.getElementById('searchInput').value.toLowerCase();

    nameList.innerHTML = '';

    const filteredNotes = notes
        .map((item, index) => ({ item, index }))
        .filter(data =>
            data.item.name.toLowerCase().includes(searchValue) ||
            data.item.phone.toLowerCase().includes(searchValue)
        );

    if(filteredNotes.length === 0){
        emptyMessage.style.display = 'block';
        return;
    }

    emptyMessage.style.display = 'none';

    filteredNotes.forEach(data => {
        const card = document.createElement('div');
        card.className = 'name-card';
        const savedDate = getNoteSavedDate(data.item);
        const mapButtons = hasLocation(data.item)
            ? `
                <button class="map-btn google" onclick="openMap(event, '${googleMapsUrl(data.item)}')" title="Open in Google Maps" aria-label="Open in Google Maps">${googleMapIcon}</button>
                <button class="map-btn waze" onclick="openMap(event, '${wazeUrl(data.item)}')" title="Open in Waze" aria-label="Open in Waze">${wazeIcon}</button>
            `
            : '';

        card.innerHTML = `
            <div class="name-info" onclick="openDetails(${data.index})">
                <div class="name-title-row">
                    <h3>${escapeHTML(data.item.name)}</h3>
                    <span class="saved-date">Saved: ${escapeHTML(savedDate)}</span>
                </div>
                <p>${escapeHTML(data.item.phone)}</p>
            </div>

            <div class="icon-buttons">
                ${mapButtons}
                <button class="icon-btn edit-btn" onclick="editName(${data.index})" title="Edit">✏</button>
                <button class="icon-btn delete-btn" onclick="deleteName(${data.index})" title="Delete">🗑</button>
            </div>
        `;

        nameList.appendChild(card);
    });
}

function editName(index){
    editIndex = index;

    document.getElementById('nameInput').value = notes[index].name;
    document.getElementById('phoneInput').value = notes[index].phone;
    document.getElementById('formBox').style.display = 'block';
    document.getElementById('nameInput').focus();
}

async function deleteName(index){
    const confirmDelete = confirm('Are you sure you want to delete this name?');

    if(confirmDelete){
        notes.splice(index, 1);
        await saveToStorage();
        showNames();
    }
}

function openDetails(index){
    currentIndex = index;

    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailsView').style.display = 'block';

    document.getElementById('detailsName').textContent = notes[index].name;
    document.getElementById('detailsPhone').textContent = notes[index].phone;
    document.getElementById('detailsSavedDate').textContent = getNoteSavedDate(notes[index]);
    document.getElementById('noteInput').value = notes[index].note || '';
    noteCurrencyMode = notes[index].noteCurrency || 'IQD';
    updateNoteCurrencyUI();
    renderNoteRows(notes[index]);
}

async function saveNote(){
    if(currentIndex === null){
        return;
    }

    const noteRows = collectNoteRows();

    notes[currentIndex].noteRows = noteRows.length ? noteRows : [{ description:'', meters:'', cost:'' }];
    notes[currentIndex].noteCurrency = noteCurrencyMode;
    notes[currentIndex].noteTotal = document.getElementById('noteTotal').textContent;
    notes[currentIndex].note = document.getElementById('noteInput').value;
    notes[currentIndex].savedDateText = document.getElementById('detailsSavedDate').textContent.trim();

    if(!notes[currentIndex].savedDateText){
        notes[currentIndex].savedAt = getSavedStamp();
        notes[currentIndex].savedDateText = formatSavedDate(notes[currentIndex].savedAt);
        document.getElementById('detailsSavedDate').textContent = notes[currentIndex].savedDateText;
    }

    await saveToStorage();

    alert('Note saved successfully.');
}

function editCurrentName(){
    if(currentIndex === null){
        return;
    }

    backToList();
    editName(currentIndex);
}

async function deleteCurrentName(){
    if(currentIndex === null){
        return;
    }

    const confirmDelete = confirm('Are you sure you want to delete this name and note?');

    if(confirmDelete){
        notes.splice(currentIndex, 1);
        await saveToStorage();
        currentIndex = null;
        backToList();
    }
}

function backToList(){
    document.getElementById('detailsView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    showNames();
}

function escapeHTML(text){
    return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}

showNames();
</script>

</body>
</html>

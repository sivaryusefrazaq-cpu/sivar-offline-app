<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:
        radial-gradient(circle at top left,#4f46e5,#111827 55%),
        linear-gradient(135deg,#0f172a,#1e293b);
    overflow-x:hidden;
    overflow-y:auto;
    padding:20px;
}

body::before,
body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    z-index:0;
}

body::before{
    background:#6366f1;
    top:-100px;
    left:-100px;
}

body::after{
    background:#06b6d4;
    bottom:-120px;
    right:-120px;
}

.dashboard-box{
    position:relative;
    z-index:2;
    width:420px;
    max-width:100%;
    padding:45px 35px;
    border-radius:30px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 10px 40px rgba(0,0,0,0.4),
        inset 0 1px 1px rgba(255,255,255,0.15);
}

.dashboard-logo{
    display:block;
    width:min(100%, 245px);
    height:auto;
    max-height:225px;
    object-fit:contain;
    margin:0 auto 26px;
    filter:
        drop-shadow(0 18px 28px rgba(0,0,0,0.42))
        drop-shadow(0 0 18px rgba(212,175,55,0.28));
    transform-origin:center;
    animation:
        logoReveal 900ms cubic-bezier(.2,.8,.2,1) both,
        logoFloat 4.5s ease-in-out 900ms infinite,
        logoGlow 3.4s ease-in-out 900ms infinite;
    transition:transform .35s ease, filter .35s ease;
}

.dashboard-logo:hover{
    transform:translateY(-4px) scale(1.025);
    filter:
        drop-shadow(0 22px 32px rgba(0,0,0,0.48))
        drop-shadow(0 0 26px rgba(255,215,0,0.42));
}

@keyframes logoReveal{
    0%{
        opacity:0;
        transform:translateY(18px) scale(.92);
        filter:blur(8px) drop-shadow(0 0 0 rgba(212,175,55,0));
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) scale(1);
    }
    50%{
        transform:translateY(-8px) scale(1.012);
    }
}

@keyframes logoGlow{
    0%,100%{
        filter:
            drop-shadow(0 18px 28px rgba(0,0,0,0.42))
            drop-shadow(0 0 16px rgba(212,175,55,0.24));
    }
    50%{
        filter:
            drop-shadow(0 20px 30px rgba(0,0,0,0.44))
            drop-shadow(0 0 28px rgba(6,182,212,0.22))
            drop-shadow(0 0 22px rgba(255,215,0,0.32));
    }
}

.menu-btn{
    width:100%;
    height:68px;
    border:none;
    border-radius:22px;
    margin-bottom:22px;
    font-size:18px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    transition:.35s ease;
    background:linear-gradient(135deg,#6366f1,#06b6d4);
    box-shadow:0 10px 25px rgba(99,102,241,0.35);
}

.menu-btn:hover{
    transform:translateY(-3px) scale(1.01);
    box-shadow:0 15px 35px rgba(99,102,241,0.45);
}

.logout-btn{
    width:100%;
    height:55px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

.logout-btn:hover{
    background:rgba(255,255,255,0.14);
}

@media(max-width:480px){
    .dashboard-box{
        width:100%;
        padding:35px 25px;
    }

    .dashboard-logo{
        width:min(100%, 220px);
        max-height:205px;
        margin-bottom:24px;
    }
}

@media (prefers-reduced-motion:reduce){
    .dashboard-logo{
        animation:none;
    }
}
</style>
</head>

<body>

<div class="dashboard-box">

    <img class="dashboard-logo" src="./s.png" alt="">

    <button class="menu-btn" onclick="window.location.href='new_invoice.html'">
        New Invoice
    </button>

    <button class="menu-btn" onclick="window.location.href='old-invoices.html'">
        Old Invoices
    </button>

    <button class="menu-btn" onclick="window.location.href='my_salary.html'">
        My Salary
    </button>

    <button class="menu-btn" onclick="window.location.href='my_works.html'">
        My Works
    </button>

    <button class="menu-btn" onclick="window.location.href='my_measurments.html'">
        My Measurements
    </button>

    <button class="menu-btn" onclick="window.location.href='note_details.html'">
        Note
    </button>

    <button class="logout-btn" onclick="window.location.href='login.html'">
        Logout
    </button>

</div>

</body>
</html>
